[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "takops-client"
version = "0.1.0"
description = "Python client for passively consuming TAKOps realtime track events."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Codehaus" }
]
dependencies = [
  "websocket-client>=1.8.0"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13"
]

[project.urls]
Homepage = "https://github.com/codehausau/takops-client-python"
Repository = "https://github.com/codehausau/takops-client-python"
Issues = "https://github.com/codehausau/takops-client-python/issues"

[tool.setuptools.packages.find]
where = ["src"]
